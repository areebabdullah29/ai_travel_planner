[project]
name = "travel-buddy-api"
version = "1.0.0"
description = "AI-powered travel planning backend with FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "motor>=3.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.25.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.6.0",
    "bcrypt>=4.1.0",
    "spacy>=3.7.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "google-adk>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx[cli]>=0.25.0",
]
